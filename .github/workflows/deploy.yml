name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        # A project site lives at /<repo>/, so every asset and link needs that
        # prefix. Taken from the repo name so a fork or rename still works.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll
        # Pages runs Jekyll by default, which drops files and folders starting
        # with an underscore — that would delete Next's entire _next/ bundle.
        run: touch out/.nojekyll

      # Pages must be switched on ONCE by a repo admin:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # `enablement: true` is deliberately not set here. Creating a Pages site
      # needs admin rights, which the workflow's GITHUB_TOKEN does not have and
      # cannot be granted through `permissions:` — it fails with "Resource not
      # accessible by integration" and buries the real cause. Better to fail on
      # the honest error ("Get Pages site failed: Not Found") than a misleading one.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
